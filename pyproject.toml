[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Multi-source financial research agent: SEC-filing RAG, earnings/news ML models, and LLM-synthesized equity reports."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "celery>=5.6.3",
    "datasets>=4.8.5",
    "fastapi>=0.136.1",
    "flower>=2.0.1",
    "groq>=0.37.1",
    "gunicorn>=25.3.0",
    "jinja2>=3.1.6",
    "jsonpatch>=1.33",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "lxml>=6.1.0",
    "matplotlib>=3.10.9",
    "mlflow>=2.19.0",
    "newsapi-python>=0.2.7",
    "pandas<3",
    "pgvector>=0.4.2",
    "prophet>=1.3.0",
    "protobuf==3.20.3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.5.0",
    "shap>=0.51.0",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "unstructured>=0.22.28",
    "uvicorn>=0.47.0",
    # requires system: libcairo2, libpango-1.0-0, libpangoft2-1.0-0
    "weasyprint>=68.1",
    "xgboost>=3.2.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6.0",
    "playwright>=1.63.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

